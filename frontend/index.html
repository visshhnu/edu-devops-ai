<!DOCTYPE html>
<html>
<head>
    <title>DevOpsAI Learning Platform</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 40px;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        select, textarea, button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
        }
        button {
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .response {
            margin-top: 20px;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>DevOpsAI Learning Platform</h2>

    <label>Course:</label>
    <select id="course">
        <option value="linux">Linux</option>
    </select>

    <label>Level:</label>
    <select id="level">
        <option value="level1">Level 1</option>
    </select>

    <label>Module:</label>
    <select id="module">
        <option value="filesystem">File System</option>
        <option value="permissions">Permissions</option>
    </select>

    <label>Ask Question:</label>
    <textarea id="question" rows="4" placeholder="Type your question here..."></textarea>

    <button onclick="askAI()">Ask AI</button>

    <div class="response" id="response"></div>
</div>

<script>
async function askAI() {
    const question = document.getElementById("question").value;
    const course = document.getElementById("course").value;
    const level = document.getElementById("level").value;
    const module = document.getElementById("module").value;

    if (!question.trim()) {
        document.getElementById("response").innerText = "Please enter a question.";
        return;
    }

    document.getElementById("response").innerText = "Thinking...";

    try {
        const response = await fetch("http://127.0.0.1:8000/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question,
                course: course,
                level: level,
                module: module
            })
        });

        console.log("Status:", response.status);

    const text = await response.text();
    console.log("Raw response:", text);

    document.getElementById("response").innerText = text;

  } catch (error) {
    console.error("Fetch error:", error);
    document.getElementById("response").innerText = "Error connecting to backend.";
  }
}
</script>

</body>
</html>
